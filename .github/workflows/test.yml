name: Test

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Test Linux
      run: swift test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Test Android
      uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8

  macos:
    name: macOS, iOS, tvOS, Mac Catalyst (Xcode), watchOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Test macOS
      run: xcodebuild test -scheme SwiftCBOR -destination 'platform=OS X,arch=x86_64'
    - name: Test iOS
      run: xcodebuild test -scheme SwiftCBOR -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
    - name: Test tvOS
      run: xcodebuild test -scheme SwiftCBOR -destination 'platform=tvOS Simulator,name=Any tvOS Simulator Device'
    - name: Test Mac Catalyst
      run: xcodebuild test -scheme SwiftCBOR -destination 'platform=macOS,variant=Mac Catalyst'
    - name: Test watchOS
      run: xcodebuild test -scheme SwiftCBOR -destination 'platform=watchOS Simulator,name=Any watchOS Simulator Device'
