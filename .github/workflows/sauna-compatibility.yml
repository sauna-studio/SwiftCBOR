name: Sauna compatibility
on:
  pull_request:
  push:
    branches:
      - master
      - codex/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift:
    name: Swift 6.4.2 bounded decoding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: swift build --jobs 2
      - run: swift test --jobs 2
